name: Refresh news calendar

on:
  # Hourly from 08:00 to 16:00 UK on weekdays, and twice in between (about 22:00 and 06:00 UK) every
  # day, so the weekend still picks up the new week's calendar (owner, 22 Oct 2026; it was every two
  # hours around the clock). GitHub's cron is UTC, so one line per clock: BST (UTC+1) by month for
  # April–October, GMT for November–March — the last Sunday of March and October are off by up to an
  # hour for a few days, which does not matter here. :17 past the hour avoids the top-of-hour queue.
  schedule:
    - cron: '17 7-15 * 4-10 1-5'
    - cron: '17 8-16 * 1-3,11,12 1-5'
    - cron: '17 5,21 * 4-10 *'
    - cron: '17 6,22 * 1-3,11,12 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/fetch_ff.js'
      - '.github/workflows/ff-calendar.yml'

permissions:
  contents: write

concurrency:
  group: ff-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Forex Factory week
        run: node tools/fetch_ff.js data/ff_week.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/ff_week.json; then
            echo "Calendar unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ff_week.json
          git commit -m "Refresh news calendar"
          git pull --rebase origin main
          git push
