<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrendClock — 20MA trend board</title>
<link rel="icon" href="favicon.svg">
<style>
  :root{--bg:#0e131a;--panel:#141b24;--line:#26313f;--text:#e6ecf3;--muted:#8b97a7;--amber:#ffcf5c;--spike:#ff6a2a;--spike-cap:#d99a5c;--spike-dim:#6a4630;--on:#ffffff;--label-w:184px;--chart-min:900px;--pad-x:22px;--up:#4fc3f7;--down:#f48fb1;--risk:#ffb14a;--start:#8bd17c}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 "Segoe UI",Inter,system-ui,-apple-system,sans-serif}
  .mono{font-family:"JetBrains Mono","SF Mono",Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 30px;padding:14px var(--pad-x) 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:linear-gradient(var(--bg),var(--bg) 85%,transparent);z-index:5}
  .clock{font-size:44px;font-weight:700;letter-spacing:.5px;line-height:1}
  .clock small{font-size:14px;color:var(--muted);font-weight:500;margin-left:8px}
  .win{font-size:15px;color:var(--muted)}
  .win b{color:var(--amber);font-size:20px;font-weight:700}
  .win .cd{color:var(--text);margin-left:10px}
  .cdbox{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 clamp(12px,1vw,26px);
         border-left:1px solid var(--line);border-right:1px solid var(--line);align-self:stretch}
  .cdbox .k{color:var(--muted);font-size:clamp(11px,.3vw,16px);text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}
  .cdbox .big{font-size:clamp(30px,1.5vw,76px);font-weight:700;line-height:1;letter-spacing:.5px;color:var(--amber);
              font-variant-numeric:tabular-nums}
  .cdbox .sub{font-size:clamp(11px,.36vw,19px);color:#c9d2dd;white-space:nowrap}
  .cdbox.soon .big{color:#ff8a4a}
  .lists{display:flex;flex-direction:column;gap:10px;min-width:min(340px,100%);flex:1}
  .lists .k{color:var(--muted);font-size:clamp(11px, .3vw, 16px);text-transform:uppercase;letter-spacing:.7px;margin-right:12px;min-width:clamp(110px, 9vw, 190px);display:inline-block}
  .chip{display:inline-flex;align-items:baseline;gap:.38em;padding:.26em .6em;border-radius:.24em;background:#1e2a3a;color:var(--on);font-weight:600;margin:.15em .38em .15em 0;font-size:clamp(13px, .53vw, 28px);line-height:1.15}
  .chip b{font-family:"JetBrains Mono","SF Mono",Consolas,monospace;font-size:1.08em;font-weight:700;color:var(--amber)}
  .chip.t b{color:#ffb38a}
  /* The looser tier, carrying the same relationship to the solid chip that a light-capped bar
     carries to a solid one: same family, visibly weaker claim. */
  .chip.t.soft{background:transparent;border:1px solid #6e3a1f;color:#c69a80}
  .chip.t.soft b{color:var(--spike-cap)}
  .chip.t{background:#3a2114;color:#ffb38a;border:1px solid #6e3a1f}
  .chip.none{background:transparent;color:var(--muted);font-weight:400;padding-left:0;font-size:clamp(12px, .42vw, 22px)}
  .chip.up{background:#153042;color:#bfe7ff;border:1px solid #2a6a8f} .chip.up b{color:var(--up)}
  .chip.down{background:#3a1f2c;color:#ffd0e0;border:1px solid #8a3c5e} .chip.down b{color:var(--down)}
  .chip.risk{background:#3a2a10;color:#ffe0a8;border:1px solid #8a6a20} .chip.risk b{color:var(--risk)}
  .chip.start{background:#1a3020;color:#cdeec5;border:1px solid #3f7a3a} .chip.start b{color:var(--start)}
  .ctrl{display:flex;flex-direction:column;gap:8px;align-items:flex-end;color:var(--muted);font-size:12px}
  .ctrl .r{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{background:#1a2330;color:var(--muted);border:0;padding:4px 10px;font:inherit;cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.sel{background:#2c3c52;color:var(--on);font-weight:700}
  .seg button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
  .ctrl select,.ctrl input{background:#1a2330;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit}
  .ctrl input{width:72px}
  .ctrl .btn{background:#1a2330;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 10px;font:inherit;cursor:pointer}
  .ctrl .btn.step{padding:3px 8px;margin:0 4px;font-weight:700;line-height:1}
  .ctrl .btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  /* Live feed status, in the header's control block. */
  .livestat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .livestat i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4a5667}
  .livestat.on i{background:#58d68d;box-shadow:0 0 6px #58d68d}
  .livestat.stale i{background:var(--risk)}
  .banner{max-width:min(1100px, calc(100% - var(--pad-x) * 2));margin:10px auto 0;padding:8px 12px;border:1px solid #5a4a20;background:#241d0f;color:var(--amber);border-radius:6px;display:none}
  .banner.show{display:block}
  .navlinks{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
  .navlink{display:inline-flex;align-items:center;padding:6px 12px;border:1px solid #6a5420;border-radius:6px;
           background:#2b2616;color:var(--amber);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
  .navlink:hover{background:#3b3420;color:#fff}
  .navlink:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  main{padding:8px var(--pad-x) 40px}
  section{position:relative;margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px 12px;overflow-x:auto}
  section h2{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);position:sticky;left:0}
  section h2 small{font-size:11px;font-weight:400;letter-spacing:.3px;text-transform:none;color:var(--muted);opacity:.8;margin-left:.9em}
  .ticks{position:relative;height:62px;margin-left:var(--label-w);min-width:calc(var(--chart-min) - var(--label-w))}
  .body{min-width:var(--chart-min)}
  .ticks span{position:absolute;top:0;transform:translateX(-50%) rotate(-55deg);transform-origin:top center;font-weight:600;font-size:10px;color:#b8c3d1;white-space:nowrap}
  .row{display:grid;grid-template-columns:var(--label-w) 1fr;align-items:center;margin-top:5px;transition:opacity .25s;min-width:var(--chart-min)}
  .row .lab{padding-right:10px;text-align:right;font-weight:600;font-size:max(13px, calc(var(--pv, 9px) * .78));color:#c9d2dd;line-height:1.15;overflow-wrap:normal}
  .row.big .lab{font-size:max(15px, calc(var(--pv, 9px) * .9));font-weight:700;color:#e6ecf3}
  .row .lab .pct{display:block;font-size:max(11px, calc(var(--pv, 9px) * .5));color:var(--muted);font-weight:500}
  .row .lab .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:3px;margin-right:5px;vertical-align:middle;background:#3a2114;color:#ffb38a;border:1px solid #6e3a1f;visibility:hidden}
  .row.turn .lab .tag{visibility:visible}
  .strips{position:relative}
  .news{position:absolute;left:0;right:0;top:0;height:4px;pointer-events:none;z-index:1}
  .news i{position:absolute;top:0;height:100%;pointer-events:auto}
  .news i.H{background:var(--spike)} .news i.M{background:#d9dfe7} .news i.L{background:#6a7889}
  .chip.n{background:#2b2616;color:#f0dfa8;border:1px solid #6a5420}
  .chip.n.soft{background:transparent;color:#cdbf95}
  .chip.n b{color:var(--amber);font-size:1em}
  .mini{max-width:min(1100px, calc(100% - var(--pad-x) * 2));margin:16px auto 2px;padding:14px 20px 15px;
        background-color:#17212d;
        background-image:linear-gradient(90deg,rgba(255,207,92,.10),rgba(255,207,92,.03) 45%,rgba(255,207,92,.015));
        border:1px solid #3c4657;border-left:4px solid var(--amber);border-radius:8px;
        box-shadow:0 6px 22px rgba(0,0,0,.5);
        color:var(--text);font-size:clamp(15px,.72vw,23px);line-height:1.6}
  .mini .k{display:block;color:var(--amber);font-size:clamp(15px,.72vw,23px);font-weight:700;line-height:1.35;margin-bottom:7px}
  .mini b{color:var(--on);font-weight:700}
  .heat,.bars{display:grid;grid-template-columns:repeat(52,1fr);gap:1px}
  .heat div{height:max(22px, calc(var(--pv, 9px) * 1.25));border-radius:1px;position:relative}
  .heat div.tr{box-shadow:inset 0 0 0 2px rgba(255,207,92,.85)}
  .heat div.thin::after{content:"";position:absolute;inset:0;border-radius:1px;background:repeating-linear-gradient(45deg,transparent 0 2px,rgba(14,19,26,.55) 2px 4px)}
  .bars{margin-top:2px;height:max(14px, calc(var(--pv, 9px) * 1.5));align-items:end}
  .bars div{height:100%;display:flex;align-items:flex-end;position:relative}
  .pv{display:none;position:absolute;inset:0;align-items:center;justify-content:center;
      font-family:"JetBrains Mono","SF Mono",Consolas,monospace;font-size:var(--pv, 9px);font-weight:700;
      color:#f2e6d8;text-shadow:0 2px 4px rgba(0,0,0,1),0 0 6px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,1);pointer-events:none;letter-spacing:-.5px}
  section.nums .bars div:not(.closed) .pv{display:flex}
  .bars div.s .pv{color:#fff}
  .bars div.weak .pv{opacity:.5}
  .bars div i{display:block;width:100%;background:var(--spike-dim);border-radius:1px 1px 0 0}
  .bars div.s i{background:var(--spike)}
  .bars div.m i{background:linear-gradient(var(--spike-cap) 0 3px, var(--spike-dim) 3px)}
  .bars div.weak i{opacity:.45;background-image:repeating-linear-gradient(45deg,transparent 0 2px,rgba(14,19,26,.6) 2px 4px)}
  .heat div.closed,.bars div.closed{background:#1b2027 !important}
  .row.agg{margin-top:calc(var(--pv, 9px) * 3.2);padding-bottom:calc(var(--pv, 9px) * .45);
           border-bottom:1px solid #3d4b5c;margin-bottom:calc(var(--pv, 9px) * 2.6)}
  section .body > .row.agg:first-child{margin-top:0}
  .row.agg .lab{color:#eef3f9}
  .row .lab .agb{display:inline-block;margin-right:.4em;padding:0 .34em;border-radius:3px;
                 background:#2a3646;color:#9fb0c4;font-weight:700;font-size:.6em;vertical-align:middle}
  .row.agg .bars{height:max(18px, calc(var(--pv, 9px) * 1.9))}
  .row.agg .pv{font-size:calc(var(--pv, 9px) * 1.28)}
  .row.agg .bars div.p50 i{background:var(--spike)}
  .row.agg .bars div.p50 .pv{color:#fff}
  .row.off{opacity:.38}
  .row .lab2{display:none;padding-left:10px;font-weight:600;font-size:max(13px, calc(var(--pv, 9px) * .78));color:#8e9aa9;line-height:1.15;overflow-wrap:normal}
  .row.big .lab2{font-size:max(15px, calc(var(--pv, 9px) * .9));color:#c9d2dd}
  .row.on .lab2{color:var(--on)}
  @media (min-width:1500px){
    .row{grid-template-columns:var(--label-w) 1fr var(--label-w)}
    .row .lab2{display:block}
    .ticks{margin-right:var(--label-w)}
    .lines{margin-right:var(--label-w)}
  }
  .row:nth-child(odd){background:rgba(255,255,255,.05);box-shadow:0 0 0 5px rgba(255,255,255,.05);border-radius:2px}
  .row.agg,.row:nth-child(odd).agg{background:rgba(126,158,196,.13);box-shadow:0 0 0 6px rgba(126,158,196,.13);border-radius:3px}
  .row.hot .lab,.row.hot .lab2{color:var(--on)}
  .row.hot,.row:nth-child(odd).hot{background:rgba(120,170,255,.17);box-shadow:0 0 0 5px rgba(120,170,255,.17)}
  .cross{position:absolute;top:0;bottom:0;background:rgba(200,220,255,.10);border-left:1px solid rgba(200,220,255,.45);border-right:1px solid rgba(200,220,255,.45);pointer-events:none;display:none;z-index:1}
  section.xhair .cross{display:block}
  .readout{position:fixed;z-index:50;pointer-events:none;display:none;background:#0b1017;border:1px solid #3a4657;border-radius:6px;padding:6px 10px;box-shadow:0 6px 20px rgba(0,0,0,.55);font-size:12px;line-height:1.45;white-space:nowrap}
  .readout.show{display:block}
  .readout b{font-size:13px;color:var(--on)}
  .readout .w{color:var(--amber);font-weight:700}
  .readout .d{color:var(--muted)}
  @media (min-width:1700px){ .row{margin-top:9px} }
  @media (min-width:2600px){ .row{margin-top:14px} }
  @media (prefers-reduced-motion:reduce){.readout{transition:none}}
  .row.on .lab{color:var(--on)}
  .row.on .lab .pct{color:var(--amber);font-weight:700}
  .lines{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
  .lines i{position:absolute;top:0;bottom:0;border-left:1px dashed #5a6675}
  .now{position:absolute;top:0;bottom:0;background:rgba(255,207,92,.14);border-left:2px solid var(--amber);border-right:2px solid var(--amber);pointer-events:none;display:none;z-index:2}
  .now::before{content:attr(data-t);position:absolute;top:-1px;left:50%;transform:translate(-50%,-100%);background:var(--amber);color:#1a1300;font-weight:700;font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap}
  .next{position:absolute;top:0;bottom:0;border:1px dashed rgba(255,207,92,.55);pointer-events:none;display:none;z-index:2}
  section.live .now,section.live .next{display:block}
  /* ---- The three chart panels: one shown at a time, chosen by the tabs. ---- */
  .tabs{display:flex;gap:6px;align-items:center;padding:14px var(--pad-x) 0;flex-wrap:wrap}
  .tabs .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.7px;margin-right:6px}
  .tabs button{background:#1a2330;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:7px 16px;font:inherit;font-weight:600;cursor:pointer}
  .tabs button.sel{background:#2c3c52;color:var(--on);border-color:#4b6381}
  .tabs button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  .tabs .note{color:var(--muted);font-size:12px;margin-left:10px}
  .panel{display:none}
  .panel.sel{display:block}
  /* ---- The overview dashboard: instruments by chart, at a glance. ---- */
  .dash{margin:14px var(--pad-x) 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px 12px;overflow-x:auto}
  .dash h2{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  .dash h2 small{font-weight:400;text-transform:none;letter-spacing:.2px;opacity:.85}
  .dsum{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;align-items:baseline;margin:4px 0 10px}
  .dsum .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
  .dgrid{display:grid;grid-template-columns:minmax(150px,max-content) repeat(3, minmax(170px,380px)) minmax(160px,1fr);gap:4px;min-width:820px}
  .dgrid .h{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px;padding:4px 8px}
  .dgrid .g{grid-column:1 / -1;color:#9fb0c4;font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:10px 8px 2px;border-bottom:1px solid #2a3542}
  .dgrid .nm{display:flex;align-items:center;padding:6px 8px;font-weight:700;color:#dbe3ec;font-size:clamp(13px,.6vw,20px)}
  .cell{position:relative;border-radius:6px;padding:6px 8px;background:#1a2230;border:1px solid #27313f;min-height:2.7em;line-height:1.25;font-size:clamp(12px,.55vw,18px)}
  /* Climatology cells take the heat strip's colour for the share, so the grid reads like the strips do. */
  .cell.hist .l1,.cell.hist .l2{text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.8)}
  .cell.hist .l1 .sub{color:#dbe3ec;font-weight:500;font-size:.86em}
  .cell.hist .l2{color:#eef3f9}
  .cell .l1{font-weight:700;color:#e6ecf3;white-space:nowrap}
  .cell .l2{color:#c9d2dd;white-space:nowrap}
  .cell .l3{color:var(--muted);font-size:.86em;white-space:nowrap}
  .cell .l1 .r,.cell .l2 .r{font-family:"JetBrains Mono","SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
  .cell.up{background:#132a3b;border-color:#2a6a8f} .cell.up .l1{color:var(--up)}
  .cell.down{background:#331a28;border-color:#8a3c5e} .cell.down .l1{color:var(--down)}
  .cell.flat{background:#1a2230}
  .cell.risk{box-shadow:inset 0 0 0 2px var(--risk)} .cell.risk .l2{color:var(--risk);font-weight:700}
  .cell.start{box-shadow:inset 0 0 0 2px var(--start)} .cell.start .l2{color:var(--start);font-weight:700}
  .cell.hist .l1{color:#e6ecf3}
  .cell.hist.tr .l1{color:var(--amber)}
  .cell.na{color:var(--muted);background:transparent;border-style:dashed}
  .cell .tag{position:absolute;top:4px;right:6px;font-size:10px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:3px;background:#3a2114;color:#ffb38a;border:1px solid #6e3a1f}
  .cell .tag.news{background:#2b2616;color:#f0dfa8;border-color:#6a5420}
  .cell .tag.stale{background:#2a2f38;color:#9fb0c4;border-color:#46505d}
  .cell.closed{opacity:.5}
  .dnews{padding:4px 6px;display:flex;flex-wrap:wrap;align-items:center;align-content:center}
  .dnews .chip{font-size:clamp(11px,.48vw,16px);margin:.1em .3em .1em 0;padding:.2em .5em}
  @media (max-width:1100px){
    :root{--label-w:150px;--chart-min:820px;--pad-x:16px}
    .clock{font-size:36px}
  }
  @media (max-width:760px){
    :root{--label-w:118px;--chart-min:700px;--pad-x:12px}
    header{gap:12px 16px;position:static}
    .clock{font-size:30px}
    .win{font-size:14px}
    .ctrl{align-items:stretch;width:100%}
    .ctrl .r{justify-content:flex-start}
    .ticks{height:54px}
    .ticks span{font-size:9px}
    .row .lab{font-size:12px}
    .row.big .lab{font-size:13px}
  }
  @media (max-width:480px){
    :root{--label-w:96px;--chart-min:620px}
    .clock{font-size:26px}
    .clock small{display:block;margin:2px 0 0}
    .win .cd{display:block;margin:0}
    .heat div{height:18px}
  }
  @media (prefers-reduced-motion:reduce){.row{transition:none}}
</style>
</head>
<body>
<header>
  <div>
    <div class="clock mono"><span id="clock">--:--:--</span><small id="zonelab">UK time</small></div>
    <div class="win mono">window <b id="winlab">—</b><span class="cd" id="cd"></span></div>
    <div class="win" id="modelab" style="margin-top:2px"></div>
    <div class="navlinks"><a class="navlink" href="brief.html">News spikes</a><a class="navlink" href="swing.html">Overnight swing</a></div>
  </div>
  <div class="cdbox">
    <span class="k">Next window in</span>
    <span class="big mono" id="cdbig">—</span>
    <span class="sub mono" id="cdsub">—</span>
  </div>
  <div class="lists">
    <div><span class="k" id="trendk">Trend window now</span><span id="trendlist"></span></div>
    <div><span class="k">Turn spike now</span><span id="turnnowlist"></span></div>
    <div><span class="k">Turn spike next</span><span id="turnnextlist"></span></div>
    <div><span class="k">News now</span><span id="newsnowlist"></span></div>
    <div><span class="k">News next</span><span id="newsnextlist"></span></div>
  </div>
  <div class="ctrl">
    <div class="r"><span class="livestat" id="livestat"><i></i><span id="livetext">live feed: connecting…</span></span></div>
    <div class="r"><span>Time zone</span>
      <div class="seg" id="timeseg">
        <button data-z="uk" class="sel" type="button">UK</button><button data-z="est" type="button">EST</button>
      </div>
    </div>
    <div class="r"><span>Day profile</span>
      <div class="seg" id="dayseg">
        <button data-m="all" class="sel">All</button><button data-m="auto">Auto</button><button data-m="0">Mon</button><button data-m="1">Tue</button><button data-m="2">Wed</button><button data-m="3">Thu</button><button data-m="4">Fri</button>
      </div>
    </div>

  const row = e.target.closest(".row"), sec = e.target.closest("section");
  const strips = row && row.querySelector(".strips");
  const k = strips ? slotFromEvent(strips, e) : -1;
  if (!row || k < 0){ clearHover(); return; }
  if (hotRow !== row){ if (hotRow) hotRow.classList.remove("hot"); row.classList.add("hot"); hotRow = row; }
  const bb = B[row.dataset.ch], r = bb.ROWS[+row.dataset.i], d = r.data[shownMode], tn = bb.TURN[+row.dataset.i].all;
  const closed = r.closed[k];
  readout.innerHTML = `<b>${r.label}</b> <span class="w">${slotLabel(k)}–${slotLabel(k+1)}</span> <span class="d">${row.dataset.ch}-min</span><br>`
    + (closed ? `<span class="d">closed</span>`
      : `trending <b>${Math.round(d.s[k]*100)}%</b> <span class="d">±${ciHalfPP(d.s[k], r.days[shownMode])} of ${r.days[shownMode]} days</span>`
        + `<br>a turn on up to <b>${Math.round(tn.pTurn[k]*100)}%</b> of days <span class="d">(all-days) · ${(tn.c[k]/r.days.all).toFixed(2)}/day vs ${(tn.lam/r.days.all).toFixed(2)} if flat · ${r.data.all.t[k].toFixed(1)}×`
        + (tn.weak ? ` · too few to read` : tn.tier[k] === 2 ? ` · <span class="w">flagged</span>` : tn.tier[k] === 1 ? ` · marked` : ``)
        + `</span>`);
  readout.classList.add("show");
  moveReadout(e);
  const body = sec.querySelector(".body"), cross = sec.querySelector(".cross");
  const b = body.getBoundingClientRect(), s = strips.getBoundingClientRect(), cw = s.width/SLOTS;
  cross.style.left = (s.left - b.left + k*cw) + "px"; cross.style.width = cw + "px";
  sec.classList.add("xhair");
});
function clearHover(){
  readout.classList.remove("show");
  document.querySelectorAll("section").forEach(s=>s.classList.remove("xhair"));
  if (hotRow){ hotRow.classList.remove("hot"); hotRow = null; }
}
$("main").addEventListener("mouseleave", clearHover);
build(); buildDash(); tick(); setInterval(tick, 1000);
// news.js and fetch are absent under the node stub in tools/board_stats.js; the board itself always has them.
if (typeof NewsFeed !== "undefined"){ loadNews(); setInterval(loadNews, 30*60000); }
if (typeof fetch !== "undefined" && typeof location !== "undefined"){ loadLive(); setInterval(loadLive, LIVE_EVERY); }
</script>
</body>
