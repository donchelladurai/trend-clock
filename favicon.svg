<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trend Clock">
  <!-- Three shapes so it survives 16px: the board's dark tile, an amber clock ring, and a hand
       that is the trend line — a short white hour hand, and an orange minute hand that dips
       and rises to one o'clock. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111923"/>
      <stop offset="1" stop-color="#1e3149"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#g)"/>
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="#ffcf5c" stroke-width="4.5"/>
  <line x1="32" y1="32" x2="21" y2="27" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M32 32 L39 36 L47 19" fill="none" stroke="#ff6a2a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="3.2" fill="#ffffff"/>
</svg>
