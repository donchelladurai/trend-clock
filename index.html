<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5m 20MA trend windows — live</title>
<style>
  :root{--bg:#0e131a;--panel:#141b24;--line:#26313f;--text:#e6ecf3;--muted:#8b97a7;--amber:#ffcf5c;--spike:#ff6a2a;--spike-dim:#6a4630;--on:#ffffff;--label-w:150px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 "Segoe UI",Inter,system-ui,-apple-system,sans-serif}
  .mono{font-family:"JetBrains Mono","SF Mono",Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 30px;padding:14px 22px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:linear-gradient(var(--bg),var(--bg) 85%,transparent);z-index:5}
  .clock{font-size:44px;font-weight:700;letter-spacing:.5px;line-height:1}
  .clock small{font-size:14px;color:var(--muted);font-weight:500;margin-left:8px}
  .win{font-size:15px;color:var(--muted)}
  .win b{color:var(--amber);font-size:20px;font-weight:700}
  .win .cd{color:var(--text);margin-left:10px}
  .lists{display:flex;flex-direction:column;gap:6px;min-width:260px;flex:1}
  .lists .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-right:8px}
  .chip{display:inline-block;padding:2px 9px;border-radius:4px;background:#1e2a3a;color:var(--on);font-weight:600;margin:2px 4px 2px 0;font-size:13px}
  .chip.t{background:#3a2114;color:#ffb38a;border:1px solid #6e3a1f}
  .chip.none{background:transparent;color:var(--muted);font-weight:400;padding-left:0}
  .ctrl{display:flex;flex-direction:column;gap:8px;align-items:flex-end;color:var(--muted);font-size:12px}
  .ctrl .r{display:flex;gap:12px;align-items:center}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{background:#1a2330;color:var(--muted);border:0;padding:4px 10px;font:inherit;cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.sel{background:#2c3c52;color:var(--on);font-weight:700}
  .seg button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
  .ctrl select,.ctrl input{background:#1a2330;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit}
  .ctrl input{width:72px}
  .ctrl .btn{background:#1a2330;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 10px;font:inherit;cursor:pointer}
  .banner{margin:12px 22px 0;padding:8px 12px;border:1px solid #5a4a20;background:#241d0f;color:var(--amber);border-radius:6px;display:none}
  .banner.show{display:block}
  main{padding:8px 22px 40px;min-width:900px}
  section{position:relative;margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px 12px}
  section h2{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  .ticks{position:relative;height:18px;margin-left:var(--label-w)}
  .ticks span{position:absolute;top:0;transform:translateX(-50%);font-weight:700;font-size:13px;color:#b8c3d1}
  .row{display:grid;grid-template-columns:var(--label-w) 1fr;align-items:center;margin-top:5px;transition:opacity .25s}
  .row .lab{padding-right:10px;text-align:right;font-weight:600;font-size:13px;color:#c9d2dd;white-space:nowrap}
  .row.big .lab{font-size:15px;font-weight:700;color:#e6ecf3}
  .row .lab .pct{display:block;font-size:11px;color:var(--muted);font-weight:500}
  .row .lab .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:3px;margin-right:5px;vertical-align:middle;background:#3a2114;color:#ffb38a;border:1px solid #6e3a1f;visibility:hidden}
  .row.turn .lab .tag{visibility:visible}
  .strips{position:relative}
  .heat,.bars{display:grid;grid-template-columns:repeat(52,1fr);gap:1px}
  .heat div{height:22px;border-radius:1px}
  .bars{margin-top:2px;height:14px;align-items:end}
  .bars div{height:100%;display:flex;align-items:flex-end}
  .bars div i{display:block;width:100%;background:var(--spike-dim);border-radius:1px 1px 0 0}
  .bars div.s i{background:var(--spike)}
  .heat div.closed,.bars div.closed{background:#1b2027 !important}
  .row.off{opacity:.38}
  .row.on .lab{color:var(--on)}
  .row.on .lab .pct{color:var(--amber);font-weight:700}
  .lines{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
  .lines i{position:absolute;top:0;bottom:0;border-left:1px dashed #5a6675}
  .now{position:absolute;top:0;bottom:0;background:rgba(255,207,92,.14);border-left:2px solid var(--amber);border-right:2px solid var(--amber);pointer-events:none;display:none;z-index:2}
  .now::before{content:attr(data-t);position:absolute;top:-1px;left:50%;transform:translate(-50%,-100%);background:var(--amber);color:#1a1300;font-weight:700;font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap}
  .next{position:absolute;top:0;bottom:0;border:1px dashed rgba(255,207,92,.55);pointer-events:none;display:none;z-index:2}
  section.live .now,section.live .next{display:block}
  .foot{color:var(--muted);font-size:11px;margin:16px 22px}
  @media (prefers-reduced-motion:reduce){.row{transition:none}}
</style>
</head>
<body>
<header>
  <div>
    <div class="clock mono"><span id="clock">--:--:--</span><small>UK time</small></div>
    <div class="win mono">window <b id="winlab">—</b><span class="cd" id="cd"></span></div>
    <div class="win" id="modelab" style="margin-top:2px"></div>
  </div>
  <div class="lists">
    <div><span class="k">Trend window now</span><span id="trendlist"></span></div>
    <div><span class="k">Turn spike now / next</span><span id="turnlist"></span></div>
  </div>
  <div class="ctrl">
    <div class="r"><span>Day profile</span>
      <div class="seg" id="dayseg">
        <button data-m="auto" class="sel">Auto</button><button data-m="all">All</button><button data-m="0">Mon</button><button data-m="1">Tue</button><button data-m="2">Wed</button><button data-m="3">Thu</button><button data-m="4">Fri</button>
      </div>
    </div>
    <div class="r">
      <label>Trend if ≥ <select id="thr"><option>55</option><option>60</option><option selected>65</option><option>70</option><option>75</option></select>% of days</label>
      <label>Preview time <input id="preview" class="mono" placeholder="HH:MM" maxlength="5"></label>
      <button class="btn" id="live" type="button">Back to live</button>
    </div>
  </div>
</header>
<div class="banner" id="banner"></div>
<main id="main"></main>
<div class="foot" id="foot"></div>

  const wdIdx = ["Mon","Tue","Wed","Thu","Fri"].indexOf(real.wd);
  const mode = dayMode === "auto" ? (wdIdx >= 0 ? String(wdIdx) : "all") : dayMode;
  applyMode(mode);
  $("modelab").textContent = "profile: " + (mode === "all" ? "all days" : WD[+mode] + "s") + (dayMode === "auto" ? " (auto)" : "") + " · " + ROWS[0].days[mode] + " days";
  const k = currentSlot(t), thr = (+$("thr").value)/100;
  const weekend = !preview && wdIdx < 0;
  const banner = $("banner");
  if (weekend || k < 0){
    banner.textContent = weekend ? `Weekend — the board runs 08:00–21:00 UK on trading days. Type a time in "Preview time" to see it in action.` : `Outside the 08:00–21:00 window. Nothing highlighted until 08:00.`;
    banner.classList.add("show"); $("winlab").textContent="—"; $("cd").textContent="";
    document.querySelectorAll("section").forEach(s=>s.classList.remove("live"));
    document.querySelectorAll(".row").forEach(r=>{ r.classList.remove("on","off","turn"); r.querySelector(".pct").textContent=""; });
    $("trendlist").innerHTML='<span class="chip none">—</span>'; $("turnlist").innerHTML='<span class="chip none">—</span>';
    return;
  }
  banner.classList.remove("show");
  if (preview){ banner.textContent = `Previewing ${pad(t.h)}:${pad(t.m)} on the ${mode==="all"?"all-days":WD[+mode]+"s"} profile — "Back to live" follows the clock.`; banner.classList.add("show"); }
  const left = 480+(k+1)*15-(t.h*60+t.m)-(t.s>0?1:0), ls = t.s>0?60-t.s:0;
  $("winlab").textContent = `${slotLabel(k)}–${k<51?slotLabel(k+1):"21:00"}`;
  $("cd").textContent = `next window in ${left}:${pad(ls)}`;
  const trend=[], turn=[];
  document.querySelectorAll(".row").forEach(row=>{
    const r = ROWS[+row.dataset.i], d = r.data[shownMode], closed = r.closed[k];
    const on = !closed && d.s[k] >= thr;
    const sp = !closed && (d.t[k] >= THR_SPIKE || (k<51 && !r.closed[k+1] && d.t[k+1] >= THR_SPIKE));
    row.classList.toggle("on", on); row.classList.toggle("off", !on); row.classList.toggle("turn", sp);
    row.querySelector(".pct").textContent = closed ? "closed" : Math.round(d.s[k]*100) + "% · turns " + d.t[k].toFixed(1) + "×";
    if (on) trend.push(r.label);
    if (sp) turn.push(r.label + (d.t[k] >= THR_SPIKE ? "" : " (next)"));
  });
  $("trendlist").innerHTML = trend.length ? trend.map(x=>`<span class="chip">${x}</span>`).join("") : '<span class="chip none">none at this threshold</span>';
  $("turnlist").innerHTML = turn.length ? turn.map(x=>`<span class="chip t">${x}</span>`).join("") : '<span class="chip none">none</span>';
  document.querySelectorAll("section").forEach(sec=>{
    sec.classList.add("live");
    const body=sec.querySelector(".body"), strip=sec.querySelector(".strips"), now=sec.querySelector(".now"), nxt=sec.querySelector(".next");
    const b=body.getBoundingClientRect(), s=strip.getBoundingClientRect(), w=s.width/SLOTS;
    now.style.left=(s.left-b.left+k*w)+"px"; now.style.width=w+"px"; now.dataset.t=slotLabel(k);
    if (k<51){ nxt.style.display="block"; nxt.style.left=(s.left-b.left+(k+1)*w)+"px"; nxt.style.width=w+"px"; } else nxt.style.display="none";
  });
}
$("dayseg").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  dayMode = b.dataset.m;
  document.querySelectorAll("#dayseg button").forEach(x=>x.classList.toggle("sel", x===b));
  tick();
});
$("thr").addEventListener("change", tick);
$("preview").addEventListener("input", e=>{
  const m = /^(\d{1,2}):(\d{2})$/.exec(e.target.value.trim());
  preview = (m && +m[1]<24 && +m[2]<60) ? {h:+m[1], m:+m[2]} : null; tick();
});
$("live").addEventListener("click", ()=>{ $("preview").value=""; preview=null; tick(); });
window.addEventListener("resize", tick);
document.getElementById("foot").textContent = "5m 20MA · 1 Sep 2025 – 28 Aug 2026 (" + ROWS[1].days.all + "–" + ROWS[8].days.all + " valid days per instrument; ~" + ROWS[0].days["0"] + " of each weekday; wheat " + ROWS[17].days.all + " days from 23 Jun 2026). Blue = share of days the 20 was trending in that 15-minute slot for the selected day profile. Orange bars = how often trends started or stopped; red = 1.5× the profile's average. Grey = not trading. Holidays and half-days are excluded per instrument.";
build(); tick(); setInterval(tick, 1000);
</script>
</body>
